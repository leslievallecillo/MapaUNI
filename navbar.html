<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <header>
    <a href="index.html" class="brand-container">
      <div class="logo-img" style="display: flex; justify-content: center; align-items: center;">
        <img src="imagenes/logo-removebg-preview.png" alt="Logo UNI-WAY" style="width: 70px; height: auto;">
      </div>
      <div class="brand-name">UNI-WAY</div>
    </a>

    <nav class="main-nav">
      <ul>
        <li><a href="index.html" class="nav-link" id="nav-inicio">INICIO</a></li>
        <li><a href="destinos.html" class="nav-link" id="nav-destinos">DESTINOS</a></li>
        <li><a href="guia.html" class="nav-link" id="nav-guia">GUÍA UNI</a></li>
        <li><a href="nosotros.html" class="nav-link" id="nav-nosotros">NOSOTROS</a></li>
        <li><a href="contactos.html" class="nav-link" id="nav-contactos">CONTACTOS</a></li>
      </ul>
    </nav>
    <div class="search-container" onclick="toggleSearchModal()">
      <input type="text" placeholder="Buscar destino..." readonly style="pointer-events: none;">
      <span class="material-icons">search</span>
    </div>

    <button class="btn-menu-movil" onclick="toggleMenuMovil()">
      <span class="material-icons">menu</span>
    </button>
  </header>

  <div class="overlay-search" id="searchOverlay" onclick="toggleSearchModal()"></div>
  <div class="search-modal" id="searchModal">
    <h3 style="margin-bottom: 20px; color: var(--primary-color); text-align: center;">Seleccionar Destino</h3>
    <form id="formBusquedaModal" onsubmit="event.preventDefault(); window.buscarDestinoModal ? window.buscarDestinoModal() : buscarDestinoModal();">
      <div class="search-input-wrapper" style="margin-bottom: 20px;">
        <span class="material-icons">location_on</span>
        <select id="busquedaDestinoModal" style="flex-grow: 1; border: none; outline: none; background: transparent; font-size: 16px; cursor: pointer; padding: 5px;">
          <option value="">Destinos disponibles...</option>
        </select>
      </div>
      <button type="submit" class="btn-select" style="width: 100%;">
        <span class="material-icons">search</span> Ir al destino
      </button>
    </form>
  </div>
</body>

</html>
